<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle with gradient matching the pill theme -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- Clock face -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
  <!-- Hour marks -->
  <line x1="64" y1="24" x2="64" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="98" x2="64" y2="104" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="64" x2="30" y2="64" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="64" x2="104" y2="64" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="64" y1="64" x2="64" y2="32" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="64" y1="64" x2="82" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="64" cy="64" r="4" fill="white"/>
  <!-- Activity indicator (matches pill status dot) -->
  <circle cx="98" cy="30" r="10" fill="#4ade80"/>
</svg>
